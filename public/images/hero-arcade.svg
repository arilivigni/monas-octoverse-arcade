<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 540" role="img" aria-labelledby="title desc">
  <title id="title">Mona's Octoverse Arcade</title>
  <desc id="desc">Original arcade artwork in a bold tile grid: a violet Mona silhouette, a pale tile patterned with “all”, “tgthr”, and “now”, an orange curly brace, Mona’s smiling portrait on lavender, a pink branching motif, a repeating green-and-purple pattern, a terminal prompt, and bright green pixel blocks.</desc>
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6a9c7"/>
      <stop offset=".52" stop-color="#f5b19b"/>
      <stop offset="1" stop-color="#ec6f9b"/>
    </linearGradient>
    <radialGradient id="eye">
      <stop offset="0" stop-color="#5638db"/>
      <stop offset="1" stop-color="#170d2a"/>
    </radialGradient>
    <pattern id="repeat" width="78" height="64" patternUnits="userSpaceOnUse">
      <rect width="78" height="64" fill="#170d2a"/>
      <path d="M-12 16 C-3 -2 16 -2 26 14 C34 27 48 27 56 13 C64 -1 78 0 88 16 M-12 56 C-3 38 16 38 26 54 C34 67 48 67 56 53 C64 39 78 40 88 56" fill="none" stroke="#159447" stroke-width="18" stroke-linecap="round"/>
    </pattern>
    <pattern id="pixels" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="translate(4 0)">
      <rect width="38" height="38" fill="#58ed7c"/>
      <rect x="19" y="19" width="19" height="19" fill="#b3a316"/>
    </pattern>
    <clipPath id="words-tile"><rect x="192" y="0" width="380" height="390"/></clipPath>
    <clipPath id="branch-tile"><rect x="0" y="198" width="192" height="342"/></clipPath>
    <clipPath id="mona-tile"><rect x="572" y="0" width="458" height="390"/></clipPath>
    <clipPath id="silhouette-tile"><rect width="192" height="198"/></clipPath>
  </defs>

  <rect width="1030" height="540" fill="#170d2a"/>

  <g clip-path="url(#silhouette-tile)" fill="#5a3cff">
    <path d="M27 57 67 21 Q101 1 139 14 L159 -8 Q174 20 182 54 Q198 117 159 146 Q137 163 104 160 Q72 156 42 134 Q7 108 12 83 Q14 69 27 57Z"/>
    <path d="M79 143 Q106 142 129 157 Q153 174 159 207 L49 207 Q57 170 79 143Z"/>
    <path d="M18 74 34 79 M18 87 34 89" fill="none" stroke="#b783f6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <rect x="192" width="380" height="390" fill="#d9d9d9"/>
  <g clip-path="url(#words-tile)" fill="#241830" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="22">
    <text x="210" y="28">all</text><text x="446" y="28">all</text><text x="500" y="28">tgthr</text>
    <text x="198" y="71">tgthr</text><text x="289" y="71">now</text><text x="525" y="71">now</text>
    <text x="289" y="114">all</text><text x="359" y="114">tgthr</text>
    <text x="368" y="157">now</text><text x="446" y="157">all</text>
    <text x="198" y="201">tgthr</text><text x="435" y="201">tgthr</text>
    <text x="211" y="245">now</text><text x="289" y="245">all</text><text x="510" y="245">all</text>
    <text x="277" y="288">tgthr</text><text x="368" y="288">now</text>
    <text x="368" y="331">all</text><text x="435" y="331">tgthr</text>
    <text x="289" y="375">all</text><text x="510" y="375">all</text>
  </g>

