      <path d="M686 244 644 239 M683 267 641 275 M971 244 1015 239 M974 267 1017 275"/>
    </g>
  </g>

  <path d="M670 0 H609 Q558 0 558 51 V138 Q558 190 522 190 H506 V222 H522 Q558 222 558 273 V338 Q558 390 609 390 H670 V339 H619 V252 Q619 207 584 196 Q619 185 619 140 V51 H670Z" fill="#c44b00"/>

  <rect y="198" width="192" height="342" fill="#f42e79"/>
  <g clip-path="url(#branch-tile)">
    <path d="M24 204 H115 Q146 204 151 229 Q154 253 137 268 L89 313 Q69 333 83 351 L161 430 Q190 460 163 486 Q148 500 127 485 L50 408 Q22 380 47 351 L107 286 Q121 270 110 259 Q103 252 90 252 H24Z" fill="none" stroke="#b3a316" stroke-width="42" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="78" cy="204" r="23" fill="#f42e79"/>
