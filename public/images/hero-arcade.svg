    <ellipse cx="925" cy="258" rx="34" ry="18" fill="#ef628d" opacity=".36"/>
    <ellipse cx="756" cy="195" rx="34" ry="42" fill="#f7e7f0"/>
    <ellipse cx="902" cy="195" rx="34" ry="42" fill="#f7e7f0"/>
    <ellipse cx="759" cy="197" rx="26" ry="35" fill="url(#eye)"/>
