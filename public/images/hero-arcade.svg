<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" role="img" aria-labelledby="title desc">
  <title id="title">Mona's Octoverse Arcade game scene</title>
  <desc id="desc">Original workshop artwork: an Octocat-inspired hero named Mona catches falling green commit squares and dodges red bugs on an arcade screen, while a purple Copilot robot sidekick cheers "+10! Keep shipping!"</desc>
  <style>
    .bob { animation: bob 3.2s ease-in-out infinite; }
    .hover { animation: hover 2.6s ease-in-out infinite; }
    .twinkle { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle.d2 { animation-delay: .8s; }
    .twinkle.d3 { animation-delay: 1.6s; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes twinkle { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1.1); } }
    @media (prefers-reduced-motion: reduce) { .bob, .hover, .twinkle { animation: none; } }
  </style>
  <defs>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#0d1a14"/>
    </linearGradient>
    <radialGradient id="floorGlow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#3fb950" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3fb950" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aiGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a371f7" stop-opacity=".45"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#3fb950" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="screenClip">
      <rect x="20" y="20" width="680" height="500" rx="28"/>
    </clipPath>

    <g id="commit">
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="#39d353"/>
      <rect x="-14" y="-14" width="28" height="28" rx="6" fill="none" stroke="#aff5b4" stroke-opacity=".6" stroke-width="2"/>
      <rect x="-9" y="-9" width="8" height="5" rx="2" fill="#aff5b4" opacity=".8"/>
    </g>

    <g id="bug">
      <g stroke="#ff7b72" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-14 -4 L-24 -10"/><path d="M-15 4 L-26 4"/><path d="M-13 11 L-22 19"/>
        <path d="M14 -4 L24 -10"/><path d="M15 4 L26 4"/><path d="M13 11 L22 19"/>
        <path d="M-4 -20 Q-8 -30 -14 -31"/><path d="M4 -20 Q8 -30 14 -31"/>
      </g>
      <ellipse cx="0" cy="4" rx="16" ry="15" fill="#f85149"/>
      <circle cx="0" cy="-15" r="8.5" fill="#da3633"/>
      <path d="M0 -8 V19" stroke="#8e1519" stroke-width="2"/>
      <circle cx="-7" cy="2" r="3" fill="#8e1519"/><circle cx="7" cy="9" r="3" fill="#8e1519"/>
      <circle cx="-3.5" cy="-16" r="2" fill="#fff"/><circle cx="3.5" cy="-16" r="2" fill="#fff"/>
    </g>

    <path id="spark" d="M0 -10 L2.6 -2.6 L10 0 L2.6 2.6 L0 10 L-2.6 2.6 L-10 0 L-2.6 -2.6 Z"/>
  </defs>

  <!-- arcade screen -->
  <rect x="20" y="20" width="680" height="500" rx="28" fill="url(#screen)"/>
  <g clip-path="url(#screenClip)">
    <rect x="20" y="20" width="680" height="500" fill="url(#grid)"/>
    <rect x="20" y="300" width="680" height="220" fill="url(#floorGlow)"/>

    <!-- stars -->
    <g fill="#f0f6fc">
      <use href="#spark" class="twinkle" transform="translate(96 132) scale(.7)"/>
      <use href="#spark" class="twinkle d2" transform="translate(640 120) scale(.9)"/>
      <use href="#spark" class="twinkle d3" transform="translate(470 92) scale(.5)"/>
      <use href="#spark" class="twinkle d2" transform="translate(196 250) scale(.45)"/>
      <use href="#spark" class="twinkle" transform="translate(612 262) scale(.5)"/>
      <circle cx="320" cy="140" r="2" opacity=".6"/><circle cx="150" cy="190" r="1.6" opacity=".5"/>
      <circle cx="560" cy="200" r="1.8" opacity=".5"/><circle cx="420" cy="230" r="1.5" opacity=".4"/>
    </g>
    <use href="#spark" fill="#d2a8ff" class="twinkle d3" transform="translate(268 96) scale(.6)"/>

    <!-- falling commits with trails -->
    <g stroke="#3fb950" stroke-linecap="round" stroke-opacity=".35" stroke-width="3">
      <path d="M150 100 V140"/><path d="M412 130 V182"/><path d="M262 238 V270"/><path d="M604 150 V180"/>
    </g>
    <use href="#commit" transform="translate(150 160)"/>
    <use href="#commit" transform="translate(412 200) rotate(12)"/>
    <use href="#commit" transform="translate(262 288) rotate(-8) scale(.85)"/>
    <use href="#commit" transform="translate(604 198) rotate(6) scale(.9)"/>

    <!-- bugs -->
    <use href="#bug" transform="translate(220 380) rotate(-14)"/>
    <use href="#bug" transform="translate(520 156) rotate(18) scale(.9)"/>
    <use href="#bug" transform="translate(96 300) rotate(8) scale(.8)"/>

    <!-- contribution-graph floor -->
    <g transform="translate(36 470)">
      <g fill="#0e4429">
        <rect x="0" y="0" width="22" height="22" rx="4"/><rect x="28" y="0" width="22" height="22" rx="4"/>
        <rect x="112" y="0" width="22" height="22" rx="4"/><rect x="280" y="0" width="22" height="22" rx="4"/>
        <rect x="448" y="0" width="22" height="22" rx="4"/><rect x="560" y="0" width="22" height="22" rx="4"/>
      </g>
      <g fill="#006d32">
        <rect x="56" y="0" width="22" height="22" rx="4"/><rect x="168" y="0" width="22" height="22" rx="4"/>
        <rect x="308" y="0" width="22" height="22" rx="4"/><rect x="420" y="0" width="22" height="22" rx="4"/>
        <rect x="588" y="0" width="22" height="22" rx="4"/>
      </g>
      <g fill="#26a641">
        <rect x="84" y="0" width="22" height="22" rx="4"/><rect x="196" y="0" width="22" height="22" rx="4"/>
        <rect x="336" y="0" width="22" height="22" rx="4"/><rect x="504" y="0" width="22" height="22" rx="4"/>
        <rect x="616" y="0" width="22" height="22" rx="4"/>
      </g>
      <g fill="#39d353">
        <rect x="140" y="0" width="22" height="22" rx="4"/><rect x="224" y="0" width="22" height="22" rx="4"/>
        <rect x="252" y="0" width="22" height="22" rx="4"/><rect x="364" y="0" width="22" height="22" rx="4"/>
        <rect x="392" y="0" width="22" height="22" rx="4"/><rect x="476" y="0" width="22" height="22" rx="4"/>
        <rect x="532" y="0" width="22" height="22" rx="4"/>
      </g>
    </g>

    <!-- Mona: original Octocat-inspired hero -->
    <g transform="translate(350 380)">
      <g class="bob">
        <ellipse cx="0" cy="84" rx="70" ry="8" fill="#010409" opacity=".55"/>
        <g fill="none" stroke="#e6edf3" stroke-width="15" stroke-linecap="round">
          <path d="M-38 30 Q-58 58 -78 62"/>
          <path d="M-18 38 Q-24 64 -38 78"/>
          <path d="M0 40 Q2 62 -4 80"/>
          <path d="M18 38 Q26 64 40 76"/>
          <path d="M38 30 Q60 54 80 56"/>
        </g>
        <path d="M-54 -26 L-62 -86 L-16 -58 Z" fill="#e6edf3"/>
        <path d="M54 -26 L62 -86 L16 -58 Z" fill="#e6edf3"/>
        <path d="M-50 -38 L-54 -72 L-28 -56 Z" fill="#f778ba"/>
        <path d="M50 -38 L54 -72 L28 -56 Z" fill="#f778ba"/>
        <ellipse cx="0" cy="-8" rx="66" ry="54" fill="#e6edf3"/>
        <!-- green headband -->
        <path d="M-63 -26 Q0 -60 63 -26 L60 -14 Q0 -46 -60 -14 Z" fill="#2ea043"/>
        <path d="M60 -22 Q80 -30 92 -18 Q78 -16 70 -8 Z" fill="#2ea043"/>
        <path d="M62 -20 Q84 -10 88 6 Q74 -2 64 -6 Z" fill="#238636"/>
        <ellipse cx="0" cy="8" rx="48" ry="32" fill="#ffd8b5"/>
        <ellipse cx="-18" cy="4" rx="8.5" ry="11.5" fill="#0d1117"/>
        <ellipse cx="18" cy="4" rx="8.5" ry="11.5" fill="#0d1117"/>
        <circle cx="-15" cy="0" r="3.2" fill="#fff"/><circle cx="21" cy="0" r="3.2" fill="#fff"/>
        <ellipse cx="0" cy="17" rx="4.5" ry="3" fill="#bf4b8a"/>
        <path d="M-8 23 Q0 31 8 23" fill="none" stroke="#0d1117" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="-32" cy="18" rx="6" ry="3.5" fill="#f778ba" opacity=".45"/>
        <ellipse cx="32" cy="18" rx="6" ry="3.5" fill="#f778ba" opacity=".45"/>
        <g stroke="#8b949e" stroke-width="2" stroke-linecap="round">
          <path d="M-36 12 L-58 8"/><path d="M-36 18 L-58 20"/>
          <path d="M36 12 L58 8"/><path d="M36 18 L58 20"/>
        </g>
      </g>
    </g>

    <!-- Copilot sidekick: original robot drone -->
    <g transform="translate(560 410)">
      <circle cx="0" cy="0" r="80" fill="url(#aiGlow)"/>
      <g class="hover">
        <path d="M-12 36 L0 58 L12 36 Z" fill="#d2a8ff" opacity=".7"/>
        <path d="M-6 36 L0 48 L6 36 Z" fill="#fff" opacity=".8"/>
        <line x1="0" y1="-30" x2="0" y2="-46" stroke="#d2a8ff" stroke-width="3" stroke-linecap="round"/>
        <use href="#spark" fill="#d2a8ff" transform="translate(0 -54) scale(.7)"/>
        <circle cx="-42" cy="2" r="10" fill="#6e40c9"/><circle cx="42" cy="2" r="10" fill="#6e40c9"/>
        <rect x="-40" y="-30" width="80" height="66" rx="26" fill="#8957e5"/>
        <path d="M-30 -22 Q-10 -30 14 -26" fill="none" stroke="#d2a8ff" stroke-width="3" stroke-linecap="round" opacity=".7"/>
        <rect x="-30" y="-14" width="60" height="32" rx="15" fill="#161b22"/>
        <rect x="-18" y="-7" width="10" height="16" rx="5" fill="#7ee787"/>
        <rect x="8" y="-7" width="10" height="16" rx="5" fill="#7ee787"/>
      </g>
    </g>

    <!-- tip bubble -->
    <g transform="translate(454 270)">
      <rect x="0" y="0" width="232" height="56" rx="16" fill="#1c1430" stroke="#a371f7" stroke-width="2"/>
      <path d="M136 54 L148 74 L158 54 Z" fill="#1c1430" stroke="#a371f7" stroke-width="2" stroke-linejoin="round"/>
      <rect x="134" y="50" width="26" height="6" fill="#1c1430"/>
      <text x="116" y="34" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="700" fill="#e2c5ff">+10! Keep shipping!</text>
    </g>

    <!-- HUD -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">
      <rect x="40" y="40" width="190" height="44" rx="12" fill="#010409" stroke="#30363d"/>
      <text x="58" y="69" font-size="18" fill="#8b949e">SCORE</text>
      <text x="128" y="69" font-size="20" fill="#3fb950">00040</text>
      <rect x="500" y="40" width="180" height="44" rx="12" fill="#010409" stroke="#30363d"/>
      <text x="518" y="69" font-size="18" fill="#8b949e">SPEED</text>
      <g fill="#3fb950"><rect x="590" y="56" width="10" height="14" rx="2"/><rect x="604" y="52" width="10" height="18" rx="2"/><rect x="618" y="48" width="10" height="22" rx="2"/></g>
      <rect x="632" y="44" width="10" height="26" rx="2" fill="#30363d"/>
      <rect x="646" y="44" width="10" height="26" rx="2" fill="#30363d"/>
    </g>
  </g>
  <rect x="20" y="20" width="680" height="500" rx="28" fill="none" stroke="#3fb950" stroke-opacity=".55" stroke-width="3"/>
  <rect x="10" y="10" width="700" height="520" rx="36" fill="none" stroke="#30363d" stroke-width="2"/>
</svg>
