      <stop offset="0" stop-color="#f9b4cf"/>
      <stop offset=".55" stop-color="#f8b89c"/>
      <stop offset="1" stop-color="#ee8aa4"/>
    </linearGradient>
    <radialGradient id="m-blush">
      <stop offset="0" stop-color="#ef5f86" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ef5f86" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-iris" cx=".45" cy=".4" r=".65">
      <stop offset="0" stop-color="#5b48a8"/>
      <stop offset="1" stop-color="#1b1240"/>
    </radialGradient>
    <g id="pixbug" fill="#2ea043"><rect x="8" y="0" width="4" height="4"/><rect x="24" y="0" width="4" height="4"/><rect x="12" y="4" width="4" height="4"/><rect x="16" y="4" width="4" height="4"/><rect x="20" y="4" width="4" height="4"/><rect x="0" y="8" width="4" height="4"/><rect x="8" y="8" width="4" height="4"/><rect x="16" y="8" width="4" height="4"/><rect x="24" y="8" width="4" height="4"/><rect x="32" y="8" width="4" height="4"/><rect x="4" y="12" width="4" height="4"/><rect x="8" y="12" width="4" height="4"/><rect x="12" y="12" width="4" height="4"/><rect x="20" y="12" width="4" height="4"/><rect x="24" y="12" width="4" height="4"/><rect x="28" y="12" width="4" height="4"/><rect x="0" y="16" width="4" height="4"/><rect x="4" y="16" width="4" height="4"/><rect x="8" y="16" width="4" height="4"/><rect x="12" y="16" width="4" height="4"/><rect x="20" y="16" width="4" height="4"/><rect x="24" y="16" width="4" height="4"/><rect x="28" y="16" width="4" height="4"/><rect x="32" y="16" width="4" height="4"/><rect x="4" y="20" width="4" height="4"/><rect x="8" y="20" width="4" height="4"/><rect x="12" y="20" width="4" height="4"/><rect x="20" y="20" width="4" height="4"/><rect x="24" y="20" width="4" height="4"/><rect x="28" y="20" width="4" height="4"/><rect x="0" y="24" width="4" height="4"/><rect x="8" y="24" width="4" height="4"/><rect x="12" y="24" width="4" height="4"/><rect x="16" y="24" width="4" height="4"/><rect x="20" y="24" width="4" height="4"/><rect x="24" y="24" width="4" height="4"/><rect x="32" y="24" width="4" height="4"/><rect x="12" y="28" width="4" height="4"/><rect x="20" y="28" width="4" height="4"/></g>
