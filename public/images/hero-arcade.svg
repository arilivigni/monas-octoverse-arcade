<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 540" role="img" aria-labelledby="title desc">
  <title id="title">Mona's Octoverse Arcade</title>
  <desc id="desc">Original workshop artwork in a colorful tile grid: a big-eyed, Octocat-inspired Mona in a green headband beside an orange curly brace; a purple Copilot robot sidekick; a git branch line; a tile of monospace words "ship", "play", and "commit"; green pixel bugs and commit squares; a terminal prompt; and a contribution-graph pixel pattern.</desc>
