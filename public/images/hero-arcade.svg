    <path d="M684 201 Q662 153 680 84 Q693 42 751 68 L786 83 Q800 89 815 83 Q881 58 923 77 Q966 57 977 71 Q986 103 970 151 Q964 171 976 205 L980 255 Q972 326 919 352 Q884 373 828 369 Q760 368 713 336 Q680 312 675 268Z" fill="#170d2a"/>
